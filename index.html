<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You are rich!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--fg1:#8a6a1f;--fg2:#c9a24a;--line:#b8923a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0c;--fg1:#e8c872;--fg2:#a8832f;--line:#c9a24a}}
:root[data-theme="dark"]{--bg:#0b0b0c;--fg1:#e8c872;--fg2:#a8832f;--line:#c9a24a}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at center,color-mix(in srgb,var(--fg2) 14%,var(--bg)) 0%,var(--bg) 65%);display:flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;text-align:center}
main{display:flex;flex-direction:column;align-items:center;gap:clamp(1.2rem,4vw,2.2rem);padding:0 1.5rem;animation:in 2.4s ease both}
.rule{width:clamp(60px,18vw,140px);height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
h1{margin:0;font-weight:300;font-style:italic;font-size:clamp(2.6rem,10vw,6.5rem);letter-spacing:.06em;line-height:1.1;background:linear-gradient(100deg,var(--fg2) 20%,var(--fg1) 45%,#fff6d6 50%,var(--fg1) 55%,var(--fg2) 80%);background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s ease-in-out infinite}
@keyframes in{from{opacity:0;transform:translateY(12px);letter-spacing:.02em}to{opacity:1;transform:none}}
@keyframes shine{0%{background-position:120% center}100%{background-position:-120% center}}
</style>
</head>
<body>
<main><div class="rule"></div><h1>You are rich!</h1><div class="rule"></div></main>
</body>
</html>
